[project]
name = "kinesis2"
version = "0.1.0"
description = "Phone-recorded hand video -> Panda arm in LIBERO: retargeted human data, a small policy, robustness and latency evals"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "mediapipe",
  "scipy",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "imageio[ffmpeg]",
]

[project.optional-dependencies]
sim = ["lerobot[libero,smolvla]"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
